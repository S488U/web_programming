<!DOCTYPE html>
<html lang="en">
<head>
    <title>String and Math Functions</title>
</head>
<body>
    <h1>String Functions</h1>
    <script>
        let str = "Hello World";
        document.write(`Length: ${str.length} <br> Uppercase: ${str.toUpperCase()} <br> Lowercase: ${str.toLowerCase()} <br> Substring: ${str.substring(0, 5)} `);
    </script>

    <h2>Math Functions</h2>
    <script>
        let num = 9;
        document.write(`Square Root: ${Math.sqrt(num)} <br> Random Number: ${Math.random()}`)
    </script>
</body>
</html>
