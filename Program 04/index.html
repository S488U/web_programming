<!DOCTYPE html>
<html lang="en">

<head>
    <title>Program 4</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .greenColor {
            color: green;
        }
    </style>
</head>

<body>
    <div>
        <h1>Welcome to CSS Example</h1>
        <p style="color: black; font-weight: bold;">This is a inline css</p>
        <p class="greenColor">This paragraph is styled with internal CSS (green color)</p>
        <p>This paragraph uses external CSS</p>
    </div>
</body>

</html>
